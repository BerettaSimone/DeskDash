name: PlatformIO & Python CI

on:
    push:
        branches: ["main"]
    pull_request: 
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout del codice
              uses: actions/checkout@v3

            - name: Installazione di PlatformIO
              run: |
               python -m pip install --upgrade pip
               pip install platformio

            - name: Compila il codice ESP
              run: pio run
